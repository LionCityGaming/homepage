---
# ============================================================
# HOME - core servers
# ============================================================
- Home:
    - Plex Media Server:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/plex.webp
        id: plex2
        href: "{{HOMEPAGE_VAR_TAUTULLI_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_TAUTULLI_URL}}"
        widget:
          type: tautulli
          url: "{{HOMEPAGE_VAR_TAUTULLI_URL}}"
          key: "{{HOMEPAGE_VAR_TAUTULLI_API_KEY}}"
          showEpisodeNumber: true
          expandOneStreamToTwoRows: true
          enableUser: true

    - Proxmox Backup Server:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/proxmox.webp
        href: "https://pbs.{{HOMEPAGE_VAR_DOMAIN}}"
        siteMonitor: "https://pbs.{{HOMEPAGE_VAR_DOMAIN}}"
        widget:
          type: proxmoxbackupserver
          url: "https://{{HOMEPAGE_VAR_PROXMOX_BACKUP_SERVER_IP}}:8007"
          username: "{{HOMEPAGE_VAR_PROXMOX_BACKUP_SERVER_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_BACKUP_SERVER_PASSWORD}}"
          datastore: Synology

    - Proxmox Server:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/webp/proxmox.webp
        href: "https://proxmox.{{HOMEPAGE_VAR_DOMAIN}}"
        siteMonitor: "https://{{HOMEPAGE_VAR_PROXMOX_IP}}:8006"
        widget:
          type: proxmox
          url: "https://{{HOMEPAGE_VAR_PROXMOX_IP}}:8006"
          username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"

    - Synology Server:
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/synology-dsm.png
        href: "https://synology.{{HOMEPAGE_VAR_DOMAIN}}"
        siteMonitor: "{{HOMEPAGE_VAR_SYNOLOGY_URL}}"
        widget:
          type: diskstation
          url: "{{HOMEPAGE_VAR_SYNOLOGY_URL}}"
          username: "{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}"
          password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
          fields: [uptime, resources.cpu, resources.mem]

# ============================================================
# NEWS - currency rates + Glance
# ============================================================
- News:
    - " ":
        widgets:
          - type: customapi
            url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/sgd.json"
            refreshInterval: 3600000
            mappings:
              - field: { sgd: myr }
                label: Malaysian Ringgit
                format: float
                precision: 2
              - field: { sgd: usd }
                label: US Dollars
                format: float
                precision: 2
              - field: { sgd: eur }
                label: Euros
                format: float
                precision: 2
              - field: { sgd: jpy }
                label: Japanese Yen
                format: float
                precision: 2

          - type: iframe
            src: "{{HOMEPAGE_VAR_GLANCE_WIDGET_URL}}"
            classes: glance
            loadingStrategy: eager
            referrerPolicy: same-origin
            allowPolicy: fullscreen

# ============================================================
# HOME ASSISTANT - full view
# ============================================================
- Home Assistant:
    - " ":
        widget:
          type: iframe
          src: "{{HOMEPAGE_VAR_HOME_ASSISTANT_WIDGET_URL}}"
          classes: home-assistant
          loadingStrategy: eager
          referrerPolicy: same-origin
          allowPolicy: fullscreen

# ============================================================
# CALENDARS & TASKS
# ============================================================
- Calendars:
    - " ":
        id: ha-calendar
        widget:
          type: iframe
          src: "{{HOMEPAGE_VAR_CALENDAR_WIDGET_URL}}"
          classes: ha-calendar
          referrerPolicy: same-origin
          allowPolicy: fullscreen
          loadingStrategy: eager
          allowScrolling: "no"
          refreshInterval: 900000

- To Do:
    - " ":
        id: todo
        widget:
          type: iframe
          src: "{{HOMEPAGE_VAR_TODO_WIDGET_URL}}"
          classes: todo
          referrerPolicy: same-origin
          allowPolicy: fullscreen
          loadingStrategy: eager
          allowScrolling: "no"
          refreshInterval: 900000

    - EPL Calendar:
        id: epl-calendar
        widget:
          type: iframe
          src: "{{HOMEPAGE_VAR_EPL_CALENDAR_WIDGET_URL}}"
          classes: epl-calendar
          referrerPolicy: same-origin
          allowPolicy: fullscreen
          loadingStrategy: eager
          allowScrolling: "no"
          refreshInterval: 900000

# ============================================================
# UPCOMING RELEASES
# ============================================================
- Upcoming:
    - Media Releases:
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/prowlarr-radarr-light.webp
        id: upcomingtv
        description: Coming Soon!
        widget:
          type: calendar
          showTime: false
          maxEvents: 41
          view: agenda
          integrations:
            - type: sonarr
              service_group: Media Acquisition
              service_name: Sonarr
              color: cyan
            - type: radarr
              service_group: Media Acquisition
              service_name: Radarr
              color: amber

